<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tiny-vue · Demos</title>
  <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f7f5f2;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
          color: #2d2a26;
          padding: 24px;
          -webkit-font-smoothing: antialiased;
      }

      .wrap {
          width: 100%;
          max-width: 520px;
      }

      .brand {
          margin-bottom: 28px;
      }

      .brand h1 {
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.02em;
      }

      .brand h1 span {
          color: #b8a99a;
          font-weight: 400;
      }

      .brand p {
          margin-top: 6px;
          font-size: 13px;
          color: #a09a92;
      }

      .list {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }

      .card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 18px 20px;
          background: #ffffff;
          border: 1px solid #ebe6e0;
          border-radius: 12px;
          text-decoration: none;
          color: inherit;
          transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      }

      .card:hover {
          border-color: #d8cfc5;
          box-shadow: 0 8px 24px -12px rgba(80, 60, 40, 0.15);
          transform: translateY(-1px);
      }

      .card-title {
          font-size: 15px;
          font-weight: 600;
      }

      .card-desc {
          margin-top: 3px;
          font-size: 12.5px;
          color: #a09a92;
      }

      .arrow {
          color: #c9c0b6;
          font-size: 18px;
          transition: color 0.2s, transform 0.2s;
      }

      .card:hover .arrow {
          color: #8a7f72;
          transform: translateX(3px);
      }

      .footer {
          margin-top: 28px;
          font-size: 12px;
          color: #b8b0a6;
          text-align: center;
      }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>tiny-vue <span>/ demos</span></h1>
    <p>A minimal Vue-like framework</p>
  </div>

  <div class="list">
    <a class="card" href="./counter/">
      <div>
        <div class="card-title">Counter</div>
        <div class="card-desc">reactive · effect · patch 最小闭环</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="./todo-list/">
      <div>
        <div class="card-title">Todo List</div>
        <div class="card-desc">组件化 · 模板 · 状态管理</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="footer">MIT License</div>
</div>
</body>
</html>
